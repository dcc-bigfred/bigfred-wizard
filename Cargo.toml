[package]
name = "bigfred-wizard"
version = "0.1.0"
edition = "2021"
description = "Party/event kiosk for BigFred (SSO, accounts, handset pairing, CV programming)"
license = "MIT"
publish = false

[workspace]
members = ["."]

[[bin]]
name = "bigfred-wizard"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No TLS features on purpose: the wizard only talks to BigFred over the
# loopback interface, and linking OpenSSL into a static musl build is a
# needless liability on the hub image.
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2"] }
futures = "0.3"
rust-embed = { version = "8", features = ["mime-guess"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "1"
notify = "8"
url = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# Wire types for the wireless-programmer Unix socket.
wp-proto = { git = "https://github.com/dcc-bigfred/wireless-programmer.git", tag = "v0.2" }
# Z21 LAN codec (no sockets). Git HTTPS so a local proto checkout is not required.
dcc-bigfred-proto-z21 = { git = "https://github.com/dcc-bigfred/proto.git", tag = "v0.1.0" }
bigfred-client = { git = "https://github.com/dcc-bigfred/sdk.git", branch = "main" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true

# Same as micronet / microdns — used by org rust-musl-ci reusable workflow.
[profile.release-assertions]
inherits = "release"
debug-assertions = true
overflow-checks = true
strip = false
