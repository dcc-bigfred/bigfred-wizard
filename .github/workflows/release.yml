# Release consumes musl artifacts from ci.yml (which checkouts sibling proto
# for the path dep `../proto/rust/z21`).
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    uses: dcc-bigfred/common/.github/workflows/rust-release.yml@v2
    with:
      elf_binaries: bigfred-wizard-linux-arm64
      elf_section: .bigfred-wizard.version
      ci_workflow: ci.yml
    secrets: inherit
